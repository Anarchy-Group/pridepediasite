<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Pridepedia</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f8f9fa;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-container{
    width:100%;
    max-width:450px;
    background:white;
    border:1px solid #dadde1;
    border-radius:8px;
    padding:30px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#6b2fb3;
    font-size:2rem;
}

.logo p{
    color:#54595d;
    margin-top:8px;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

label{
    font-weight:600;
    font-size:.95rem;
}

input{
    padding:12px;
    border:1px solid #a2a9b1;
    border-radius:4px;
    font-size:1rem;
}

button{
    background:#6b2fb3;
    color:white;
    border:none;
    padding:12px;
    border-radius:4px;
    cursor:pointer;
    font-size:1rem;
}

button:hover{
    opacity:.95;
}

.error{
    display:none;
    padding:12px;
    background:#ffeaea;
    border:1px solid #ffb3b3;
    color:#b00020;
    border-radius:4px;
    margin-bottom:15px;
}

.success{
    display:none;
    padding:12px;
    background:#eaffea;
    border:1px solid #9ad99a;
    color:#006400;
    border-radius:4px;
    margin-bottom:15px;
}

.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    color:#3366cc;
    text-decoration:none;
}

.links a:hover{
    text-decoration:underline;
}

.loading{
    opacity:.7;
    pointer-events:none;
}
</style>
</head>
<body>

<div class="login-container">

<div class="logo">
    <h1>🌈 Pridepedia</h1>
    <p>Sign in with Plum Identity</p>
</div>

<div id="errorBox" class="error"></div>
<div id="successBox" class="success"></div>

<form id="loginForm">

    <div>
        <label>Email Address</label>
        <input
            type="email"
            id="email"
            required
            autocomplete="email"
        >
    </div>

    <div>
        <label>Password</label>
        <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
        >
    </div>

    <button type="submit">
        Log In
    </button>

</form>

<div class="links">
    <p>
        Don't have an account?
        <a href="/register.html">Register</a>
    </p>

    <br>

    <a href="/">← Back to Pridepedia</a>
</div>

</div>

<!-- Supabase CDN Script -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://jihpgbsghatuwwkacsur.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppaHBnYnNnaGF0dXd3a2Fjc3VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzkxNzcsImV4cCI6MjA5MzcxNTE3N30.qH7iso7t2zoOLi0C68DiUKZecyIDhlxVcJAcNhYLHTk";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById("loginForm");
const errorBox = document.getElementById("errorBox");
const successBox = document.getElementById("successBox");

// Session Check
async function checkExistingSession() {
    try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            window.location.href = "/";
        }
    } catch (err) {
        console.error("Session check failed:", err);
    }
}
checkExistingSession();

// Form Submission
form.addEventListener("submit", async (e) => {
    e.preventDefault();

    errorBox.style.display = "none";
    successBox.style.display = "none";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    form.classList.add("loading");

    try {
        // 1. Log the user in
        const result = await supabaseClient.auth.signInWithPassword({ email, password });

        if (result.error) {
            form.classList.remove("loading");
            errorBox.innerHTML = `<strong>Login Failed</strong><br>${result.error.message}`;
            errorBox.style.display = "block";
            return;
        }

        const uid = result.data.user.id;
        const TARGET_SERVICE = "Pridepedia";

        // 2. FIXED QUERY: Specifically check if THIS user ID already has a "Pridepedia Portal" row listed
        const { data: matchedService, error: fetchError } = await supabaseClient
            .from("user_services")
            .select("id")
            .eq("user_id", uid)
            .eq("service_name", TARGET_SERVICE);

        if (fetchError) {
            console.error("Error checking user_services:", fetchError);
        }

        // 3. If that specific service name doesn't exist for this UID yet, create it!
        if (!matchedService || matchedService.length === 0) {
            console.log(`Missing '${TARGET_SERVICE}' for this user. Inserting service mapping row...`);
            
            const { error: insertError } = await supabaseClient
                .from("user_services")
                .insert([
                    {
                        user_id: uid,
                        service_name: TARGET_SERVICE,
                        service_icon: "🌈",
                        service_url: "https://pridepedia.magicplum.co.uk",
                        enabled: true
                    }
                ]);

            if (insertError) {
                console.error("Failed adding service row entry:", insertError);
            } else {
                console.log(`Successfully mapped '${TARGET_SERVICE}' to UID.`);
            }
        } else {
            // Already has this service mapped, leave everything else untouched!
            console.log(`User already has '${TARGET_SERVICE}' registered. Skipping entry creation.`);
        }

        // Complete process & redirect
        form.classList.remove("loading");
        successBox.textContent = "Successfully signed in. Redirecting...";
        successBox.style.display = "block";

        setTimeout(() => {
            window.location.href = "/";
        }, 800);

    } catch (err) {
        form.classList.remove("loading");
        errorBox.innerHTML = `<strong>Unexpected Runtime Error</strong><br>${err.message}`;
        errorBox.style.display = "block";
    }
});
</script>

</body>
</html>
